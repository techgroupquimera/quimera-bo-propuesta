<!doctype html>
<html lang="es-BO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El favicon es la quimera de la marca, en SVG: 8 KB que se ven nítidos a
         cualquier tamaño, del cuadradito de 16px de la pestaña al icono grande
         de un marcador. Antes era el logo alado en línea fina, que a 16px se
         deshacía en un rayón gris.

         El webp queda de respaldo para los navegadores que no leen SVG en el
         favicon (Safari 15 y anteriores) y es el MISMO dibujo, rasterizado del
         propio SVG: si fueran dos marcas distintas, el sitio tendría dos
         identidades según el navegador.

         `alternate icon` y no dos `icon` a secas: es lo que hace que Chrome y
         Firefox se queden con el SVG y bajen sólo ése. El favicon no es un
         detalle de carga — el navegador lo pide con prioridad ALTA, o sea que
         compite directamente con el poster del hero. -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="alternate icon" type="image/webp" href="/assets/favicon.webp" />
    <meta name="theme-color" content="#050604" />
    <title>Group Quimera · Tecnología a medida para empresas · Santa Cruz, Bolivia</title>
    <meta
      name="description"
      content="Ponemos la IA a trabajar dentro de tu empresa: agentes que atienden y venden, procesos automáticos y la foto real del negocio en una pantalla. Santa Cruz, Bolivia."
    />

    <!-- Manrope se sirve desde acá, no desde Google, y se precarga: es la que
         pinta el titular del hero. El porqué está en src/index.css. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/manrope-400-600.woff2"
      crossorigin
    />
    <!-- Instrument Serif itálica: son dos palabras del titular del hero, pero
         están DENTRO del h1, así que sin precargar el titular se recompone
         cuando la fuente llega. Pesa 21,6 KB. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-400-italic.woff2"
      crossorigin
    />
    <!-- Marca que hay JavaScript, antes de que se pinte nada. Lo usa la regla
         `[data-js] .reveal-oculto` de index.css: las secciones que entran con
         scroll salen VISIBLES en el HTML y sólo se esconden si de verdad va a
         haber quien las anime. Sin esto, y con el bundle cargando después del
         primer pintado, media página quedaría en blanco esperándolo. -->
    <script>
      document.documentElement.dataset.js = ''
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
